<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .iframe-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            overflow: hidden;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
        }
        .iframe-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #888; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col">

    <!-- ================= LOGIN SECTION ================= -->
    <div id="login-section" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
            <div class="text-center mb-8">
                <div class="bg-blue-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg">
                    <i class="fas fa-user-shield text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Selamat Datang</h1>
                <p class="text-gray-500 text-sm mt-2">Login dengan akun Supabase Anda</p>
            </div>
            
            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-envelope text-gray-400"></i>
                        </div>
                        <input type="email" id="email" class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="Masukkan email" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="password" class="pl-10 w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="Masukkan password" required>
                    </div>
                </div>
                
                <div id="error-msg" class="text-red-500 text-sm hidden font-medium"></div>
                
                <div id="lockout-msg" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg hidden">
                    <p class="font-bold text-sm"><i class="fas fa-ban mr-2"></i>Akses Diblokir Sementara</p>
                    <p class="text-sm mt-1">Terlalu banyak percobaan gagal. Coba lagi dalam: <span id="countdown" class="font-mono font-bold text-lg">05:00</span></p>
                </div>

                <button type="submit" id="login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg shadow-md transition duration-300 focus:ring-4 focus:ring-blue-300">
                    Masuk
                </button>
            </form>
        </div>
    </div>

    <!-- ================= DASHBOARD SECTION ================= -->
    <div id="dashboard-section" class="hidden flex-grow flex flex-col">
        <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <div class="flex items-center">
                        <i class="fas fa-cubes text-blue-600 text-2xl mr-3"></i>
                        <span class="font-bold text-xl tracking-tight">My Dashboard</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button id="add-entry-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg shadow text-sm font-medium transition-colors flex items-center">
                            <i class="fas fa-plus mr-2"></i> Tambah Entri
                        </button>
                        <button id="logout-btn" class="text-gray-500 hover:text-red-600 transition-colors p-2 rounded-full hover:bg-gray-100" title="Keluar">
                            <i class="fas fa-sign-out-alt text-lg"></i>
                        </button>
                    </div>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">
            <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
                <img src="https://placehold.co/200x200/e2e8f0/64748b?text=Kosong" alt="Kosong" class="w-48 h-48 rounded-full mb-6 opacity-50">
                <h3 class="text-xl font-bold text-gray-700 mb-2">Belum ada data tersimpan</h3>
                <p class="text-gray-500 max-w-md">Mulai simpan catatan atau tautan web penting Anda.</p>
            </div>

            <div id="entries-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Data dari Supabase akan muncul di sini -->
            </div>
        </main>
    </div>

    <!-- ================= MODAL TAMBAH/EDIT ================= -->
    <div id="entry-modal" class="fixed inset-0 z-50 hidden overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
            <div class="fixed inset-0 bg-gray-500 bg-opacity-75 transition-opacity" id="modal-overlay"></div>
            <div class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full relative z-10">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <h3 class="text-lg leading-6 font-bold text-gray-900" id="modal-title">Tambah Entri Baru</h3>
                    <div class="mt-4 space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Judul</label>
                            <input type="text" id="entry-title" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500" placeholder="Judul Catatan">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Catatan</label>
                            <textarea id="entry-note" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500" placeholder="Tulis catatan di sini..."></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">URL (Opsional)</label>
                            <input type="url" id="entry-url" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-blue-500" placeholder="https://contoh.com">
                        </div>
                        <div class="flex items-center">
                            <input id="entry-embed" type="checkbox" class="h-4 w-4 text-blue-600 rounded">
                            <label for="entry-embed" class="ml-2 text-sm text-gray-700">Tampilkan Web (Embed Iframe)</label>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button id="save-entry-btn" class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-blue-600 text-base font-medium text-white hover:bg-blue-700 sm:ml-3 sm:w-auto sm:text-sm">Simpan</button>
                    <button id="cancel-modal-btn" class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">Batal</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= TOAST NOTIFICATION ================= -->
    <div id="toast" class="fixed bottom-5 right-5 bg-gray-800 text-white px-6 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center">
        <i id="toast-icon" class="fas fa-info-circle mr-3"></i>
        <span id="toast-message">Notifikasi</span>
    </div>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        // ==========================================
        // KONFIGURASI SUPABASE (Sudah Terisi)
        // ==========================================
        const SUPABASE_URL = 'https://idtylyoqafobkbqufoni.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_M4XdxCrR_9T8KudoNek6zQ_2bKt663d';
        
        let supabase;
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        } catch(e) {
            alert("Terjadi kesalahan saat menghubungkan ke Supabase.");
        }

        let entriesData = [];
        let lockoutTimer = null;

        const ui = {
            loginSection: document.getElementById('login-section'),
            dashboardSection: document.getElementById('dashboard-section'),
            emailInput: document.getElementById('email'),
            passwordInput: document.getElementById('password'),
            loginBtn: document.getElementById('login-btn'),
            errorMsg: document.getElementById('error-msg'),
            lockoutMsg: document.getElementById('lockout-msg'),
            countdownEl: document.getElementById('countdown'),
            grid: document.getElementById('entries-grid'),
            emptyState: document.getElementById('empty-state'),
            modal: document.getElementById('entry-modal'),
            modalOverlay: document.getElementById('modal-overlay'),
            titleInput: document.getElementById('entry-title'),
            noteInput: document.getElementById('entry-note'),
            urlInput: document.getElementById('entry-url'),
            embedInput: document.getElementById('entry-embed')
        };

        // --- SISTEM KEAMANAN (RATE LIMITING) ---
        function checkRateLimit() {
            const lockoutUntil = localStorage.getItem('lockoutUntil');
            if (lockoutUntil && Date.now() < parseInt(lockoutUntil)) {
                disableLoginForm(parseInt(lockoutUntil));
            } else {
                localStorage.removeItem('lockoutUntil');
                localStorage.setItem('loginAttempts', '0');
            }
        }

        function disableLoginForm(endTime) {
            ui.emailInput.disabled = true;
            ui.passwordInput.disabled = true;
            ui.loginBtn.disabled = true;
            ui.loginBtn.classList.add('opacity-50');
            ui.errorMsg.classList.add('hidden');
            ui.lockoutMsg.classList.remove('hidden');

            lockoutTimer = setInterval(() => {
                const diff = endTime - Date.now();
                if (diff <= 0) {
                    clearInterval(lockoutTimer);
                    localStorage.removeItem('lockoutUntil');
                    localStorage.setItem('loginAttempts', '0');
                    location.reload(); 
                } else {
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);
                    ui.countdownEl.innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                }
            }, 1000);
        }

        // --- CEK LOGIN SAAT HALAMAN DIBUKA ---
        async function checkLogin() {
            if(!supabase) return;
            const { data: { session } } = await supabase.auth.getSession();
            if (session) showDashboard();
            else showLogin();
            checkRateLimit();
        }

        // --- PROSES LOGIN ---
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = ui.emailInput.value.trim();
            const password = ui.passwordInput.value;

            ui.loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            ui.loginBtn.disabled = true;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            ui.loginBtn.innerHTML = 'Masuk';
            ui.loginBtn.disabled = false;

            if (error) {
                let attempts = parseInt(localStorage.getItem('loginAttempts') || '0') + 1;
                localStorage.setItem('loginAttempts', attempts);

                if (attempts >= 3) {
                    const lockoutTime = Date.now() + (5 * 60 * 1000); 
                    localStorage.setItem('lockoutUntil', lockoutTime);
                    disableLoginForm(lockoutTime);
                } else {
                    ui.errorMsg.innerText = `Email/Password salah! (Sisa percobaan: ${3 - attempts})`;
                    ui.errorMsg.classList.remove('hidden');
                }
            } else {
                localStorage.setItem('loginAttempts', '0');
                ui.emailInput.value = ''; ui.passwordInput.value = '';
                showDashboard();
                showToast("Login berhasil!", "success");
            }
        });

        // --- PROSES LOGOUT ---
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            showLogin();
            showToast("Anda telah keluar.", "info");
        });

        function showLogin() { ui.dashboardSection.classList.add('hidden'); ui.loginSection.classList.remove('hidden'); }
        function showDashboard() { ui.loginSection.classList.add('hidden'); ui.dashboardSection.classList.remove('hidden'); loadData(); }

        // --- AMBIL DATA DARI SUPABASE ---
        async function loadData() {
            const { data, error } = await supabase.from('entries').select('*').order('created_at', { ascending: false });
            if (!error) {
                entriesData = data || [];
                renderData();
            } else {
                showToast("Gagal mengambil data dari tabel", "error");
                console.error(error);
            }
        }

        // --- TAMPILKAN DATA KE LAYAR ---
        function renderData() {
            ui.grid.innerHTML = '';
            if (entriesData.length === 0) {
                ui.emptyState.classList.remove('hidden');
                return;
            }
            ui.emptyState.classList.add('hidden');

            entriesData.forEach(entry => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm border border-gray-100 p-5 flex flex-col h-full";
                
                let contentHTML = `<h3 class="font-bold text-lg text-gray-900 mb-2">${escapeHTML(entry.title)}</h3>`;
                if (entry.note) contentHTML += `<p class="text-gray-600 text-sm mb-4 flex-grow">${escapeHTML(entry.note)}</p>`;
                if (entry.url) {
                    if (entry.embed) {
                        contentHTML += `<div class="iframe-container"><iframe src="${escapeHTML(entry.url)}"></iframe></div>`;
                    } else {
                        contentHTML += `<a href="${escapeHTML(entry.url)}" target="_blank" class="text-blue-600 text-sm hover:underline"><i class="fas fa-external-link-alt"></i> Buka Web</a>`;
                    }
                }
                
                contentHTML += `
                    <div class="border-t mt-4 pt-3 flex justify-end space-x-2">
                        <button onclick="deleteData('${entry.id}')" class="text-red-500 hover:text-red-700 text-sm"><i class="fas fa-trash"></i> Hapus</button>
                    </div>`;
                card.innerHTML = contentHTML;
                ui.grid.appendChild(card);
            });
        }

        // --- SIMPAN DATA KE SUPABASE ---
        document.getElementById('save-entry-btn').addEventListener('click', async () => {
            const title = ui.titleInput.value;
            const note = ui.noteInput.value;
            const url = ui.urlInput.value;
            const embed = ui.embedInput.checked;

            if (!title) return showToast("Judul wajib diisi!", "error");

            document.getElementById('save-entry-btn').innerHTML = "Menyimpan...";
            document.getElementById('save-entry-btn').disabled = true;

            const { error } = await supabase.from('entries').insert([{ title, note, url, embed }]);

            document.getElementById('save-entry-btn').innerHTML = "Simpan";
            document.getElementById('save-entry-btn').disabled = false;

            if(error) {
                showToast("Gagal menyimpan data", "error");
                console.error(error);
            } else {
                ui.modal.classList.add('hidden');
                showToast("Berhasil disimpan!", "success");
                loadData();
            }
        });

        // --- HAPUS DATA DARI SUPABASE ---
        window.deleteData = async (id) => {
            if (!confirm("Hapus data ini secara permanen?")) return;
            
            const { error } = await supabase.from('entries').delete().eq('id', id);
            
            if(!error){
                showToast("Berhasil dihapus", "success");
                loadData();
            } else {
                showToast("Gagal menghapus", "error");
            }
        };

        // --- KONTROL MODAL ---
        document.getElementById('add-entry-btn').addEventListener('click', () => {
            ui.titleInput.value = '';
            ui.noteInput.value = '';
            ui.urlInput.value = '';
            ui.embedInput.checked = false;
            ui.modal.classList.remove('hidden');
        });
        document.getElementById('cancel-modal-btn').addEventListener('click', () => ui.modal.classList.add('hidden'));

        // --- UTILITY FUNGSI ---
        function showToast(msg, type) {
            const t = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            t.className = `fixed bottom-5 right-5 text-white px-6 py-3 rounded-lg shadow-lg z-50 transform transition-all duration-300 translate-y-0 opacity-100 ${type === 'error' ? 'bg-red-600' : 'bg-green-600'}`;
            setTimeout(() => t.classList.replace('translate-y-0', 'translate-y-20'), 3000);
        }
        function escapeHTML(str) { return str ? str.replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t])) : ''; }

        // --- MULAI APLIKASI ---
        checkLogin();
    </script>
</body>
</html>
